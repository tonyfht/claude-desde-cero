name: Enlaces

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  enlaces-relativos:
    name: Comprobar enlaces relativos de los .md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
